[project]
name = "hack-hunt"
version = "0.1.0"
description = "Opportunity Hunt Aggregator (FastAPI + Streamlit + Scrapers)"
requires-python = ">=3.10"
dependencies = [
	"fastapi==0.116.0",
	"uvicorn[standard]==0.35.0",
	"sqlalchemy==2.0.41",
	"alembic==1.16.3",
	"psycopg[binary]==3.2.9",
	"pgvector==0.3.5",
	"PyJWT==2.10.1",
	"pydantic-settings==2.10.1",
	"sentence-transformers==5.0.0",
	"scikit-learn==1.5.2",
	"httpx==0.28.1",
	"beautifulsoup4==4.13.4",
	"python-dateutil==2.9.0.post0",
	"playwright==1.54.0",
	"python-dotenv==1.1.1",
	"streamlit==1.47.0",
	"requests==2.32.4",
	"pandas==2.3.1",
	"plotly==6.2.0",
	"pymupdf==1.26.3",
	"cryptography==45.0.6",
	"openai==1.97.1",
	"instructor==1.8.3",
]

[project.scripts]
butler = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
